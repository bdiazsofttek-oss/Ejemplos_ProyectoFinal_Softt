  "components": {
    "securitySchemes": {
      "session": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "Login": {
        "type": "object",
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 8
          }
        }
      },
      "Restaurant": {
        "type": "object",
        "required": [
          "name",
          "slug",
          "city"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "slug": {
            "type": "string",
            "pattern": "^[a-z0-9-]+$"
          },
          "city": {
            "type": "string"
          },
          "cuisine": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "openingTime": {
            "type": "string",
            "example": "09:00"
          },
          "closingTime": {
            "type": "string",
            "example": "23:00"
          },
          "thresholdSeconds": {
            "type": "integer",
            "minimum": 15
          },
          "active": {
            "type": "boolean"
          }
        }
      },
      "Table": {
        "type": "object",
        "required": [
          "label",
          "seats"
        ],
        "properties": {
          "label": {
            "type": "string"
          },
          "seats": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30
          }
        }
      },
      "Product": {
        "type": "object",
        "required": [
          "name",
          "priceCents"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "category": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "priceCents": {
            "type": "integer",
            "minimum": 0
          },
          "active": {
            "type": "boolean"
          }
        }
      },
      "Order": {
        "type": "object",
        "required": [
          "tableId",
          "items"
        ],
        "properties": {
          "tableId": {
            "type": "string"
          },
          "notes": {
            "type": "string"
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "object",
              "required": [
                "productId",
                "quantity"
              ],
              "properties": {
                "productId": {
                  "type": "string"
                },
                "quantity": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 99
                }
              }
            }
          }
        }
      },
      "Reservation": {
        "type": "object",
        "required": [
          "date",
          "time",
          "guests",
          "name",
          "email",
          "consent"
        ],
        "properties": {
          "date": {
            "type": "string",
            "format": "date"
          },
          "time": {
            "type": "string",
            "example": "14:00"
          },
          "guests": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30
          },
          "tableId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "consent": {
            "const": true
          }
        }
      },
      "User": {
        "type": "object",
        "required": [
          "name",
          "email",
          "password",
          "role"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 8
          },
          "role": {
            "enum": [
              "gerente",
              "mesero",
              "cocina"
            ]
          }
        }
      },
      "Page": {
        "type": "object",
        "required": [
          "projectData",
          "html",
          "css"
        ],
        "properties": {
          "projectData": {
            "type": "object"
          },
          "html": {
            "type": "string"
          },
          "css": {
            "type": "string"
          }
        }
      },
      "Zone": {
        "type": "object",
        "required": [
          "tableId",
          "points"
        ],
        "properties": {
          "tableId": {
            "type": "string"
          },
          "points": {
            "type": "array",
            "minItems": 3,
            "maxItems": 20,
            "items": {
              "type": "array",
              "minItems": 2,
              "maxItems": 2,
              "items": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              }
            }
          }
        }
      },
      "Observation": {
        "type": "object",
        "required": [
          "tableId",
          "action"
        ],
        "properties": {
          "tableId": {
            "type": "string"
          },
          "action": {
            "enum": [
              "arrive",
              "wait",
              "attend",
              "dish"
            ]
          },
          "frameIndex": {
            "type": "integer",
            "minimum": 0,
            "maximum": 24
          }
        }
      },
      "Status": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string"
          }
        }
      }
    }
  }
}
