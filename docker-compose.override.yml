# Keep frontend dependencies inside Docker so a fresh checkout does not need
# Bun (or node_modules) installed on the host.
services:
  app:
    volumes:
      - .:/app
      - app-node_modules:/app/node_modules
    command: sh -c "bun install --frozen-lockfile && bun run dev -- --host 0.0.0.0 --port 5173"

volumes:
  app-node_modules:
